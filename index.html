<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投資前ルール確認">
<meta name="theme-color" content="#1a2234">
<title>投資前ルール確認</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2234;
    --navy-light: #243048;
    --navy-mid: #2e3d58;
    --gold: #c4a35a;
    --gold-light: #d4b878;
    --cream: #f5f0e8;
    --cream-dark: #e8e0d0;
    --text-primary: #f0ebe0;
    --text-secondary: #a0967e;
    --text-muted: #6b6454;
    --green-soft: #4a7c5a;
    --border: rgba(196, 163, 90, 0.2);
    --border-light: rgba(196, 163, 90, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--navy);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ── HEADER ── */
  .header {
    padding: 52px 24px 20px;
    border-bottom: 0.5px solid var(--border);
  }
  .header-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'Noto Serif JP', serif;
  }
  .header-title {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-primary);
    font-family: 'Noto Serif JP', serif;
    line-height: 1.4;
  }
  .header-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ── PROGRESS ── */
  .progress-bar-wrap {
    padding: 14px 24px 0;
  }
  .progress-track {
    height: 2px;
    background: var(--border-light);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: right;
  }

  /* ── ACCORDION LIST ── */
  .rules-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 100px;
  }

  .rule-item {
    border-bottom: 0.5px solid var(--border-light);
  }

  .rule-header {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    cursor: pointer;
    user-select: none;
    gap: 14px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .rule-header:active { background: rgba(196,163,90,0.05); }

  .rule-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--text-muted);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }
  .rule-item.checked .rule-check {
    background: var(--green-soft);
    border-color: var(--green-soft);
  }
  .rule-check-mark {
    width: 10px;
    height: 6px;
    border-left: 1.5px solid white;
    border-bottom: 1.5px solid white;
    transform: rotate(-45deg) translateY(-1px);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .rule-item.checked .rule-check-mark { opacity: 1; }

  .rule-title-wrap { flex: 1; }
  .rule-number {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }
  .rule-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    font-family: 'Noto Serif JP', serif;
  }
  .rule-item.checked .rule-title { color: var(--text-muted); }

  .rule-chevron {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    transition: transform 0.25s ease;
    opacity: 0.4;
  }
  .rule-item.open .rule-chevron { transform: rotate(180deg); }

  .rule-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .rule-item.open .rule-body { max-height: 800px; }

  .rule-content {
    padding: 0 24px 20px 60px;
  }
  .rule-reason {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 10px;
    font-style: italic;
    border-left: 2px solid var(--border);
    padding-left: 12px;
  }
  .rule-checklist {
    list-style: none;
  }
  .rule-checklist li {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    padding: 3px 0;
    padding-left: 14px;
    position: relative;
  }
  .rule-checklist li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--text-muted);
    font-size: 11px;
  }

  /* ── BOTTOM CTA ── */
  .bottom-cta {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 24px 36px;
    background: linear-gradient(to top, var(--navy) 70%, transparent);
  }
  .cta-btn {
    width: 100%;
    padding: 16px;
    border-radius: 4px;
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .cta-btn.disabled {
    background: var(--navy-mid);
    color: var(--text-muted);
    border: 0.5px solid var(--border-light);
    cursor: not-allowed;
  }
  .cta-btn.ready {
    background: var(--gold);
    color: var(--navy);
  }
  .cta-btn.ready:active { transform: scale(0.98); background: var(--gold-light); }
  .cta-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ── BRIEFING SCREEN ── */
  .briefing-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }
  .briefing-intro {
    padding: 20px 0 16px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 20px;
  }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 90%;
    font-size: 13px;
    line-height: 1.8;
    padding: 12px 16px;
    border-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--navy-mid);
    color: var(--text-primary);
    border: 0.5px solid var(--border);
  }
  .msg.ai {
    align-self: flex-start;
    background: rgba(196,163,90,0.08);
    color: var(--text-secondary);
    border: 0.5px solid var(--border-light);
  }
  .msg.ai .ai-label {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: block;
  }

  .input-area {
    padding: 12px 0 36px;
    border-top: 0.5px solid var(--border);
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .briefing-input {
    flex: 1;
    background: var(--navy-light);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    padding: 12px;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    outline: none;
    line-height: 1.6;
  }
  .briefing-input::placeholder { color: var(--text-muted); }
  .briefing-input:focus { border-color: rgba(196,163,90,0.4); }
  .send-btn {
    width: 44px;
    height: 44px;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .send-btn:active { transform: scale(0.95); background: var(--gold-light); }
  .send-btn svg { width: 16px; height: 16px; fill: var(--navy); }
  .send-btn:disabled { background: var(--navy-mid); cursor: not-allowed; }
  .send-btn:disabled svg { fill: var(--text-muted); }

  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .loading-dots span {
    width: 5px; height: 5px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: dot 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .finish-btn {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: transparent;
    border: 0.5px solid var(--gold);
    border-radius: 4px;
    color: var(--gold);
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .finish-btn:active { background: rgba(196,163,90,0.1); }
  .finish-btn.hidden { display: none; }

  /* ── LAUNCH SCREEN ── */
  .launch-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    gap: 12px;
  }
  .launch-icon {
    width: 56px; height: 56px;
    border: 0.5px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  .launch-icon svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.5; }
  .launch-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .launch-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 260px;
  }
  .launch-btn {
    margin-top: 20px;
    padding: 16px 40px;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    color: var(--navy);
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .launch-btn:active { transform: scale(0.97); }
  .launch-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: -4px;
  }

  .divider {
    width: 40px;
    height: 0.5px;
    background: var(--border);
    margin: 8px auto;
  }
</style>
</head>
<body>

<!-- ═══ SCREEN 1: RULES ═══ -->
<div class="screen active" id="screen-rules">
  <div class="header">
    <div class="header-label">Morning Brief</div>
    <div class="header-title">投資前ルール確認</div>
    <div class="header-date" id="today-date"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label">0 / 20 確認済み</div>
  </div>
  <div class="rules-list" id="rules-list"></div>
  <div class="bottom-cta">
    <button class="cta-btn disabled" id="next-btn" onclick="goToBriefing()">すべて確認してから進む</button>
    <div class="cta-note" id="cta-note">各項目を開いて閉じると確認済みになります</div>
  </div>
</div>

<!-- ═══ SCREEN 2: AI BRIEFING ═══ -->
<div class="screen" id="screen-briefing">
  <div class="header">
    <div class="header-label">Today's Briefing</div>
    <div class="header-title">今日の状態を確認する</div>
  </div>
  <div class="briefing-wrap">
    <div class="briefing-intro">
      今日の気持ち、気になっている銘柄、やりそうな行動などを自由に話してください。マイルールに照らして見解をお伝えします。
    </div>
    <div class="chat-area" id="chat-area"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea class="briefing-input" id="briefing-input" placeholder="今日の状態、気になること…" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 16 16"><path d="M14 8L2 2l2 6-2 6 12-6z"/></svg>
        </button>
      </div>
      <button class="finish-btn hidden" id="finish-btn" onclick="goToLaunch()">確認完了 — 取引を開始する</button>
    </div>
  </div>
</div>

<!-- ═══ SCREEN 3: LAUNCH ═══ -->
<div class="screen" id="screen-launch">
  <div class="launch-wrap">
    <div class="launch-icon">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div class="launch-title">準備完了</div>
    <div class="divider"></div>
    <div class="launch-subtitle">ルール確認とブリーフィングが完了しました。落ち着いて、今日も丁寧に臨みましょう。</div>
    <button class="launch-btn" onclick="openSBI()">SBIアプリを開く</button>
    <div class="launch-note">SBI証券 スマートフォンサイトへ</div>
  </div>
</div>

<script>
const RULES = [
  {
    num: '01',
    title: '最優先ルール：大きく負けない',
    reason: '自分が把握していない銘柄は、買うポイントも売るポイントも分からない。値動きだけで入ると過去に大きく負けている。',
    items: ['事業内容・業績・テーマ性・材料を把握していない銘柄は買わない','「下がりすぎだからリバウンドしそう」という理由だけで買わない','「急に上がり始めたから乗りたい」という理由だけで買わない','セクター全体の急落後のリバウンド狙いを、即興で行わない','買う理由・売る理由・損切りラインが説明できない銘柄は買わない']
  },
  {
    num: '02',
    title: '決算またぎは基本的にしない',
    reason: '決算またぎは、上がる理由よりも下がる理由の方が多く、再現性が低い。期待してまたいだ結果、利益を飛ばした経験がある。',
    items: ['思惑だけの決算またぎは禁止','好決算でも、材料出尽くし・コンセンサス未達で下がることを前提に考える','決算前に含み益がある場合は、一部利確または全利確を検討する','決算は「結果」だけでなく「市場の反応」を見てから入ることを優先する']
  },
  {
    num: '03',
    title: '大きな賭けに出ない',
    reason: '自信がある時ほど、過去の大負けを思い出す。小さい勝ちを積み重ねる方が自分には合っている。',
    items: ['1銘柄に一気に300万〜400万円を入れない','1回のエントリーは原則100万円以下に抑える','できれば30万円前後から打診買いする','シナリオに自信がある銘柄でも、段階的に100万円程度までにする']
  },
  {
    num: '04',
    title: '追いかけ買いをしない',
    reason: '低いところで入れたのに、急騰後に追従買いして平均単価を上げ、その後の押しで含み損化することが多い。',
    items: ['安く買えた後に、すぐ追従買いしない','窓を開けて上がった銘柄を追いかけて買わない','追いかけ買いするくらいなら、利確を検討する','5%以上急騰した日は、基本的に買い増ししない']
  },
  {
    num: '05',
    title: '仕込みは平常心の時に行う',
    reason: '大きく勝とうとしすぎず、小さい勝ちを積み重ねる。',
    items: ['場中に焦って買わない','板や1分足を見て興奮している時は買わない','静かな時、横ばいの時、押し目の時に仕込む','5〜10%上がった時は、買うよりも放置または利確を考える','10万円程度の利益が出たら、一部利確も検討する']
  },
  {
    num: '06',
    title: '打診買いから入る',
    reason: '買った後に考えるのではなく、買う前に撤退条件を決める。',
    items: ['最初から本気買いしない','まずは100株、または30万円前後で入る','値動き・出来高・地合い・材料反応を見てから追加する','想定と違えばすぐ切る','打診買いの時点で損切りラインを決める']
  },
  {
    num: '07',
    title: '買う前に必ず確認すること',
    reason: 'ファンダメンタルとチャートの両面から確認する。',
    items: ['株探で業績を確認する','売上・営業利益・EPSが伸びているか確認する','PER・PBRが業界内で高すぎないか確認する','短期線・中期線・長期線の並びを確認する','上昇トレンドか確認する','損切りラインをどこに置けるか確認する','出来高が急増しすぎていないか確認する']
  },
  {
    num: '08',
    title: '人から聞いた銘柄をすぐ買わない',
    reason: '人から聞いた銘柄は、入口は魅力的でも、出口を自分で決められないことが多い。',
    items: ['先輩・友人・詳しい人から聞いた銘柄をすぐ買わない','まずはウォッチリストに入れる','自分で調べる','自分の買いポイントまで待つ','自分のルールに合わなければ買わない']
  },
  {
    num: '09',
    title: '底当てゲームをしない',
    reason: '底を当てるのではなく、反転の兆しを確認してから入る。',
    items: ['落ちているナイフは触らない','下落中に「そろそろ底だろう」で買わない','下げ止まりを確認してから入る','下ひげ陽線・横ばい期間・出来高の変化を確認する']
  },
  {
    num: '10',
    title: '買うタイミングの基本ルール',
    reason: '「上昇トレンドの押し目買い」を基本とする。どこで買って、どこで切るか分かる形だけ入る。',
    items: ['短期線・中期線・長期線が上向きである','上昇トレンドの中の押し目である','どのラインで反発を狙うのか明確である','そのラインを割ったら損切りできる','地合いが極端に悪い時は無理に入らない']
  },
  {
    num: '11',
    title: '勝ちパターン：テーマ株の静かな仕込み',
    reason: '急騰中に飛び乗るのではなく、静かな時に仕込む。',
    items: ['旬のテーマに乗っている','過去に何度か急騰している','急騰後に落ち着いて横ばいになっている','直近に大きな決算リスクがない','ダウンサイドが限定的に見える','100万円程度までなら仕込む価値がある']
  },
  {
    num: '12',
    title: 'ナンピンは原則しない',
    reason: '過去にナンピンで大きく痛い思いをしているため、基本は禁止。',
    items: ['想定と違う下落でナンピンしない','含み損を助けるためのナンピンはしない','長期線を割ったらナンピンではなく撤退を優先する']
  },
  {
    num: '13',
    title: '感情が動いている時は買わない',
    reason: '負けの多くは「値動きに反応してしまった時」「取り返したい時」に起きやすい。',
    items: ['悔しい時に買わない','取り返したい時に買わない','急騰を見て焦って買わない','損切り直後に別銘柄へ飛びつかない','「今日中に取り返したい」と思ったら、その日は新規買いしない','大きく勝った直後も、気が大きくなっているので買わない']
  },
  {
    num: '14',
    title: '寄り付き・PTSを信用しすぎない',
    reason: 'PTSと本市場の動きは別物。特に決算後は、寄り付き前の期待と実際の需給が大きくズレることがある。',

const SYSTEM_PROMPT = `あなたは個人投資家のパーソナルアドバイザーです。ユーザーは以下の厳格な投資マイルールを持っています。

${RULES.map(r => `【${r.num}. ${r.title}】\n${r.items.join('、')}`).join('\n\n')}

ユーザーが今日の気持ちや気になる銘柄、やりそうな行動を話してきます。以下の方針で対応してください：
- マイルールに照らして、具体的なリスクや注意点を指摘する
- 感情的にならず、落ち着いたアナリストのような口調で話す
- 短く、的確に。長文は避ける。
- 問題なければそのまま背中を押す。ルールに反しそうなら、どのルールに引っかかるかを明示する
- 日本語で回答する`;

let checkedCount = 0;
let hasChatted = false;
const TOTAL = RULES.length;

function init() {
  const d = new Date();
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('today-date').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;

  const list = document.getElementById('rules-list');
  RULES.forEach((rule, i) => {
    const item = document.createElement('div');
    item.className = 'rule-item';
    item.id = `rule-${i}`;
    item.innerHTML = `
      <div class="rule-header" onclick="toggleRule(${i})">
        <div class="rule-check"><div class="rule-check-mark"></div></div>
        <div class="rule-title-wrap">
          <div class="rule-number">RULE ${rule.num}</div>
          <div class="rule-title">${rule.title}</div>
        </div>
        <svg class="rule-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="4 6 8 10 12 6"/>
        </svg>
      </div>
      <div class="rule-body">
        <div class="rule-content">
          <div class="rule-reason">${rule.reason}</div>
          <ul class="rule-checklist">${rule.items.map(it => `<li>${it}</li>`).join('')}</ul>
        </div>
      </div>`;
    list.appendChild(item);
  });
}

function toggleRule(i) {
  const item = document.getElementById(`rule-${i}`);
  const wasOpen = item.classList.contains('open');

  document.querySelectorAll('.rule-item.open').forEach(el => el.classList.remove('open'));

  if (!wasOpen) {
    item.classList.add('open');
  } else {
    if (!item.classList.contains('checked')) {
      item.classList.add('checked');
      checkedCount++;
      updateProgress();
    }
  }
}

function updateProgress() {
  const pct = (checkedCount / TOTAL) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${checkedCount} / ${TOTAL} 確認済み`;

  const btn = document.getElementById('next-btn');
  const note = document.getElementById('cta-note');
  if (checkedCount === TOTAL) {
    btn.className = 'cta-btn ready';
    btn.textContent = 'ブリーフィングへ進む →';
    note.textContent = 'AIと今日の状態を確認します';
  }
}

function goToBriefing() {
  if (checkedCount < TOTAL) return;
  document.getElementById('screen-rules').classList.remove('active');
  document.getElementById('screen-briefing').classList.add('active');
}

function goToLaunch() {
  document.getElementById('screen-briefing').classList.remove('active');
  document.getElementById('screen-launch').classList.add('active');
}

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function appendMsg(role, text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'ai') {
    div.innerHTML = `<span class="ai-label">ANALYST</span>${text}`;
  } else {
    div.textContent = text;
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function showLoading() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'loading-msg';
  div.innerHTML = `<span class="ai-label">ANALYST</span><div class="loading-dots"><span></span><span></span><span></span></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('briefing-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  appendMsg('user', text);
  messages.push({ role: 'user', content: text });

  showLoading();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'エラーが発生しました。';

    document.getElementById('loading-msg')?.remove();
    appendMsg('ai', reply);
    messages.push({ role: 'assistant', content: reply });
    hasChatted = true;

    if (messages.length >= 2) {
      document.getElementById('finish-btn').classList.remove('hidden');
    }
  } catch (e) {
    document.getElementById('loading-msg')?.remove();
    appendMsg('ai', 'エラーが発生しました。ネットワークを確認してください。');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

function openSBI() {
  window.open('https://k.sbisec.co.jp/bsite/visitor/top.do', '_blank');
}

init();
</script>
